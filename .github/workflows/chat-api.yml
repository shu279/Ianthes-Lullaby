name: Deploy AI chat API

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/chat-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-api
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CHAT_API_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix backend
      - run: npm --prefix backend run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
